services:
  api:
    build: .
    container_name: raasta-ai-api
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DB_MODE: auto
      MONGODB_URI: mongodb://mongo:27017/raasta_ai
      MONGODB_DB_NAME: raasta_ai
      CORS_ORIGINS: '*'
      LIVE_TICK_MS: 100
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: raasta-ai-mongo
    ports:
      - '27017:27017'
    volumes:
      - raasta-mongo-data:/data/db
    restart: unless-stopped

volumes:
  raasta-mongo-data:
