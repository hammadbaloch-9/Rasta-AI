        side: { type: string, nullable: true }
        severity: { type: string, nullable: true }
        score: { type: number, nullable: true }
        evidenceStrength: { type: string }
        likelyCauses:
          type: array
          items: { type: string }
        interventions:
          type: array
          items:
            $ref: '#/components/schemas/Intervention'
        caveats:
          type: array
          items: { type: string }
        disclaimer: { type: string }

  securitySchemes: {}
