        indicators:
          type: array
          items: { type: object, additionalProperties: true }
        likelyCauses:
          type: array
          items:
            type: string
            enum:
              - approach_closure
              - insufficient_capacity
              - turning_conflict
              - demand_imbalance
              - signal_allocation
              - general_congestion
        preliminaryInterventions:
          type: array
          items: { type: string }
        caveat: { type: string }

    Intervention:
      type: object
      properties:
        type:
          type: string
          enum:
            - incident_management
            - signal_optimization
            - turn_restriction
            - lane_or_road_redesign
            - grade_separation_study
        title: { type: string }
        rationale: { type: string }
        supportingEvidence:
          type: array
          items: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        studyRequired: { type: boolean }
        canSignalTimingSolve: { type: boolean }
        nextSteps:
          type: array
          items: { type: string }

    Evaluation:
      type: object
      properties:
        hotspotId: { type: string, nullable: true }
